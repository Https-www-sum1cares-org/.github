# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['18.20.0', '20.0.0', '22.0.0']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Detect npm project files
      id: npm_project
      run: |
        if [ -f package.json ]; then
          echo "has_package=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_package=false" >> "$GITHUB_OUTPUT"
        fi
        if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
          echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_lockfile=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Use Node.js ${{ matrix.node-version }} (with npm cache)
      if: steps.npm_project.outputs.has_lockfile == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Use Node.js ${{ matrix.node-version }} (without cache)
      if: steps.npm_project.outputs.has_lockfile != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies (lockfile)
      if: steps.npm_project.outputs.has_package == 'true' && steps.npm_project.outputs.has_lockfile == 'true'
      run: npm ci
    - name: Skip npm tasks without lockfile
      if: steps.npm_project.outputs.has_package == 'true' && steps.npm_project.outputs.has_lockfile != 'true'
      run: echo "Skipping npm lint/build/test because no lockfile was found."
    - name: Lint
      if: steps.npm_project.outputs.has_package == 'true' && steps.npm_project.outputs.has_lockfile == 'true'
      run: npm run lint --if-present
    - name: Build
      if: steps.npm_project.outputs.has_package == 'true' && steps.npm_project.outputs.has_lockfile == 'true'
      run: npm run build --if-present
    - name: Test
      if: steps.npm_project.outputs.has_package == 'true' && steps.npm_project.outputs.has_lockfile == 'true'
      run: npm run test --if-present
